spring:
  application:
    name: auth-service

  data:
    mongodb:
      #uri: mongodb+srv://jberyassine:Rachide2000@cluster0.zc1yfw6.mongodb.net/sample_mflix?retryWrites=true&w=majority&appName=Cluster0
      uri: ${MONGODB_URI}
      # hostname: auth-service

server:
  port: 9031

app:
  verificationCodeExpirationMs: 300000

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry.service-registry.svc.cluster.local:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}:${random.value}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true

