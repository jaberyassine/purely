server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # === AUTH-SERVICE ===
        - id: auth-service-actuator
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/actuator/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth-service/**
          filters:
            - RewritePath=/auth-service/(?<segment>.*), /auth/${segment}

        # === NOTIFICATION-SERVICE ===
        - id: notification-service-actuator
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification-service/actuator/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notification-service/**
          filters:
            - RewritePath=/notification-service/(?<segment>.*), /notification/${segment}

        # === CATEGORY-SERVICE ===
        - id: category-service-actuator
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/category-service/actuator/**
          filters:
            - StripPrefix=1
        - id: category-service
          uri: lb://CATEGORY-SERVICE
          predicates:
            - Path=/category-service/**
          filters:
            - RewritePath=/category-service/(?<segment>.*), /category/${segment}

        # === PRODUCT-SERVICE ===
        - id: product-service-actuator
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-service/actuator/**
          filters:
            - StripPrefix=1
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-service/**
          filters:
            - RewritePath=/product-service/(?<segment>.*), /product/${segment}

        # === USER-SERVICE ===
        - id: user-service-actuator
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/actuator/**
          filters:
            - StripPrefix=1
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/**
          filters:
            - RewritePath=/user-service/(?<segment>.*), /user/${segment}

        # === CART-SERVICE ===
        - id: cart-service-actuator
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart-service/actuator/**
          filters:
            - StripPrefix=1
        - id: cart-service
          uri: lb://CART-SERVICE
          predicates:
            - Path=/cart-service/**
          filters:
            - RewritePath=/cart-service/(?<segment>.*), /cart/${segment}

        # === ORDER-SERVICE ===
        - id: order-service-actuator
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/actuator/**
          filters:
            - StripPrefix=1
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/**
          filters:
            - RewritePath=/order-service/(?<segment>.*), /order/${segment}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          "[/**]":
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry.service-registry.svc.cluster.local:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    hostname: api-gateway
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
