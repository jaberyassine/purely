spring:
  application:
    name: product-service
  data:
    mongodb:
      #uri: mongodb+srv://jberyassine:Rachide2000@cluster0.zc1yfw6.mongodb.net/sample_mflix?retryWrites=true&w=majority&appName=Cluster0
      uri: ${MONGODB_URI}
      hostname: user-service

server:
  port: 9013

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry.service-registry.svc.cluster.local:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: from-yml-test-${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true