name: SonarCloud Frontend Analysis

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/sonar-frontend-analysis.yml'

jobs:
  analyze-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install SonarScanner
        run: npm install -g sonar-scanner

      - name: Run SonarCloud analysis
        working-directory: frontend
        run: |
          sonar-scanner \
            -Dsonar.projectKey=frontend-ms \
            -Dsonar.organization=jaberyassine \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t frontend-app:latest .

      - name: Scan Docker image with Trivy
        run: |
          mkdir -p trivy-reports/frontend
          trivy image --format table --output trivy-reports/frontend/trivy-report.txt frontend-app:latest
          trivy image --format json --output trivy-reports/frontend/trivy-report.json frontend-app:latest

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report-frontend
          path: trivy-reports/frontend
