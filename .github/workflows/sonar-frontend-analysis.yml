name: SonarCloud Frontend Analysis

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/sonar-frontend-analysis.yml'

jobs:
  analyze-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Install SonarScanner
        run: npm install -g sonar-scanner

      - name: Run SonarCloud analysis
        working-directory: frontend
        run: |
          sonar-scanner \
            -Dsonar.projectKey=frontend-ms \
            -Dsonar.organization=jaberyassine \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: frontend/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build Docker image
        working-directory: frontend
        run: docker build -t jaberyassine/frontend-app:latest .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jaberyassine/frontend-app:latest
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Login to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Push Docker image to ACR
        run: |
          docker tag jaberyassine/frontend-app:latest ${{ secrets.ACR_LOGIN_SERVER }}/frontend-app:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/frontend-app:latest

