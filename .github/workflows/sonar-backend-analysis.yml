name: SonarCloud Backend Analysis

on:
  push:
    paths:
      - 'README.md'
      - 'microservice-backend/**'
      - '.github/workflows/sonar-backend-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          auth-service,
          user-service,
          cart-service,
          category-service,
          product-service,
          order-service,
          notification-service,
          api-gateway,
          service-registry
        ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        working-directory: microservice-backend/${{ matrix.service }}
        run: mvn clean verify -DskipTests

      - name: SonarCloud Analysis
        working-directory: microservice-backend/${{ matrix.service }}
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=${{ matrix.service }}-ms \
            -Dsonar.organization=jaberyassine \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Check Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@master
        with:
          scanMetadataReportFile: microservice-backend/${{ matrix.service }}/.scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: Build Docker image
        run: |
          docker build -t jaberyassine/${{ matrix.service }}:latest microservice-backend/${{ matrix.service }}

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: jaberyassine/${{ matrix.service }}:latest
          format: table
          exit-code: 0
          ignore-unfixed: true

      - name: Login to Azure Container Registry (ACR)
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Push Docker image to ACR
        run: |
          docker tag jaberyassine/${{ matrix.service }}:latest ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ matrix.service }}:latest


