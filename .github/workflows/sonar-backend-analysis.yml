name: SonarCloud Analysis - Backend

on:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/sonar-backend-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          auth-service,
          user-service,
          cart-service,
          category-service,
          product-service,
          order-service,
          notification-service,
          api-gateway,
          service-registry
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          projectBaseDir: microservice-backend/${{ matrix.service }}
          args: >
            -Dsonar.projectKey=${{ matrix.service }}-ms
            -Dsonar.organization=jaberyassine
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
            
            
            
            
