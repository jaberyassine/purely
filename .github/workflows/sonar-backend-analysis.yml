name: SonarCloud Analysis - Backend

on:
  push:
    paths:
      - 'microservice-backend/**'
      - '.github/workflows/sonar-backend-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          auth-service,
          user-service,
          cart-service,
          category-service,
          product-service,
          order-service,
          notification-service,
          api-gateway,
          service-registry
        ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          host: https://sonarcloud.io
          token: ${{ secrets.SONAR_TOKEN }}
          projectBaseDir: microservice-backend/${{ matrix.service }}
