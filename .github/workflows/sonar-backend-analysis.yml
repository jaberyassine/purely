name: SonarCloud Backend Analysis

on:
  push:
    paths:
      - 'microservice-backend/**'
      - '.github/workflows/sonar-backend-analysis.yml'

jobs:
  analyze:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [
          auth-service,
          user-service,
          cart-service,
          category-service,
          product-service,
          order-service,
          notification-service,
          api-gateway,
          service-registry
        ]

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with Maven
        working-directory: microservice-backend/${{ matrix.service }}
        run: mvn clean verify

      - name: SonarCloud Analysis
        working-directory: microservice-backend/${{ matrix.service }}
        run: mvn sonar:sonar \
          -Dsonar.projectKey=${{ matrix.service }}-ms \
          -Dsonar.organization=jaberyassine \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
