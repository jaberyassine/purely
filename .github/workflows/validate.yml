name: Validate
on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore: ['k8s/charts/**/values.yaml', 'docs/**', '*.md']
  workflow_call:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, auth-service, cart-service, category-service, notification-service, order-service, product-service, service-registry, user-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test and package
        working-directory: microservice-backend/${{ matrix.service }}
        run: mvn -B verify -Dspring.profiles.active=test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.service }}
          path: microservice-backend/${{ matrix.service }}/target/surefire-reports/
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: frontend
  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: node scripts/check-config.cjs
      - name: Test Sonar authentication preflight without credentials or network
        run: python3 -m unittest discover -s scripts/tests -p test_sonar_access.py
      - name: Validate Helm charts
        run: |
          for chart in k8s/charts/* k8s/observability; do
            helm lint "$chart" --strict
            helm template verify "$chart" >/dev/null
          done
      - run: terraform -chdir=infra fmt -check -recursive
      - run: terraform -chdir=infra init -backend=false -input=false
      - run: terraform -chdir=infra validate
