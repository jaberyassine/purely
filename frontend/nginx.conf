server {
  listen 8080;
  server_name _;
  location = /healthz { access_log off; return 200 'ok'; }
  location / { return 308 https://$host$request_uri; }
}
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /etc/nginx/tls/tls.crt;
  ssl_certificate_key /etc/nginx/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Strict-Transport-Security "max-age=31536000" always;
  root /usr/share/nginx/html;
  location ~ ^/(auth|user|product|category|cart|order|notification)-service/actuator(?:/|$) { return 404; }
  location ~ ^/(auth|user|product|category|cart|order|notification)-service/ {
    resolver 10.1.0.10 valid=10s;
    set $gateway api-gateway.api-gateway.svc.cluster.local;
    proxy_pass http://$gateway$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
  }
  location / { try_files $uri $uri/ /index.html; }
}
