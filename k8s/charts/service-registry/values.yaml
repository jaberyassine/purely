replicaCount: 1

image:
  repository: purelyregistry.azurecr.io/service-registry
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8761
  targetPort: 8761

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 150m
    memory: 256Mi

env: []

prometheus:
  enabled: true
  path: /actuator/prometheus
  interval: 15s
