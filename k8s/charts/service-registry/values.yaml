replicaCount: 1
image:
  repository: purelyacr.azurecr.io/service-registry
  tag: unreleased
service:
  type: ClusterIP
  port: 80
  targetPort: 8761
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env: []
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s
