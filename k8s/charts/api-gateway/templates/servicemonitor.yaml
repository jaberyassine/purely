{{- if .Values.prometheus.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Chart.Name }}-monitor
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Values.prometheus.releaseLabel | default "monitoring" | quote }}
spec:
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: {{ .Values.prometheus.portName | default "http" | quote }}
      path: {{ .Values.prometheus.path | default "/actuator/prometheus" | quote }}
      interval: {{ .Values.prometheus.interval | default "15s" | quote }}
{{- end }}
