replicaCount: 1

image:
  repository: purelyacr.azurecr.io/api-gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

env: []

prometheus:
  enabled: true
  releaseLabel: kube-prometheus-stack
  path: /actuator/prometheus
  interval: 15s



