replicaCount: 1
image:
  repository: purelyys71154f86.azurecr.io/notification-service
  tag: d72c22acfe7750877ef8bfd0d3567813edfb5f47
service:
  type: ClusterIP
  port: 80
  targetPort: 9020
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: SMTP_HOST
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-host }
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-username }
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-password }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s
