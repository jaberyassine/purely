replicaCount: 1
image:
  repository: purelyacr.azurecr.io/notification-service
  tag: unreleased
service:
  type: ClusterIP
  port: 80
  targetPort: 9020
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: SMTP_HOST
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-host }
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-username }
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-password }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s
