replicaCount: 1
image:
  repository: purelyys71154f86.azurecr.io/notification-service
  tag: 9e7d2885126d3cfa2aa47f46b3145f38b4ac742f
service:
  type: ClusterIP
  port: 80
  targetPort: 9020
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: SMTP_PORT
    value: '587'
  - name: SPRING_APPLICATION_JSON
    value: '{"spring":{"mail":{"properties":{"mail.smtp.ssl.checkserveridentity":true}}}}'
  - name: JAVA_TOOL_OPTIONS
    value: '-Djavax.net.ssl.trustStore=/etc/purely/trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit'
  - name: SMTP_HOST
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-host }
  - name: SMTP_USERNAME
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-username }
  - name: SMTP_PASSWORD
    valueFrom:
      secretKeyRef: { name: smtp-secret, key: smtp-password }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s

runtimeTrust:
  enabled: true
  secretName: runtime-trust
