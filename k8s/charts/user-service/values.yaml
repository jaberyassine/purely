replicaCount: 1
image:
  repository: purelyacr.azurecr.io/user-service
  tag: unreleased
service:
  type: ClusterIP
  port: 80
  targetPort: 9052
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef: { name: mongodb-secret, key: uri }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s
