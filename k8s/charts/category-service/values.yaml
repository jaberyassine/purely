replicaCount: 1
image:
  repository: purelyys71154f86.azurecr.io/category-service
  tag: faba2c50d7f65be483c0087aafcba68ffade5430
service:
  type: ClusterIP
  port: 80
  targetPort: 9001
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: JAVA_TOOL_OPTIONS
    value: '-Djavax.net.ssl.trustStore=/etc/purely/trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit'
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef: { name: mongodb-secret, key: uri }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s

runtimeTrust:
  enabled: true
  secretName: runtime-trust
