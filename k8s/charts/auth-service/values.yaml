replicaCount: 1
image:
  repository: purelyys71154f86.azurecr.io/auth-service
  tag: d72c22acfe7750877ef8bfd0d3567813edfb5f47
service:
  type: ClusterIP
  port: 80
  targetPort: 9031
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef: { name: mongodb-secret, key: uri }
  - name: JWT_SECRET
    valueFrom:
      secretKeyRef: { name: auth-secret, key: jwt-secret }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s
