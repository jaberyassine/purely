replicaCount: 2
image:
  repository: purelyys71154f86.azurecr.io/product-service
  tag: d72c22acfe7750877ef8bfd0d3567813edfb5f47
service:
  type: ClusterIP
  port: 80
  targetPort: 9013
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { cpu: '1', memory: 768Mi }
env:
  - name: JAVA_TOOL_OPTIONS
    value: '-Djavax.net.ssl.trustStore=/etc/purely/trust/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12 -Djavax.net.ssl.trustStorePassword=changeit'
  - name: MONGODB_URI
    valueFrom:
      secretKeyRef: { name: mongodb-secret, key: uri }
prometheus:
  enabled: true
  releaseLabel: monitoring
  path: /actuator/prometheus
  interval: 15s

runtimeTrust:
  enabled: true
  secretName: runtime-trust
