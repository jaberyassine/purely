apiVersion: v1
kind: Service
metadata:
  name: frontend
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: { app: frontend }
  ports:
    - { name: https, port: {{ .Values.service.port }}, targetPort: https }
