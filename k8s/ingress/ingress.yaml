apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: purely-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: nginx
  rules:
    - host: purely-app.local
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 8081
          - path: /users
            pathType: Prefix
            backend:
              service:
                name: user-service
                port:
                  number: 8082
          - path: /products
            pathType: Prefix
            backend:
              service:
                name: product-service
                port:
                  number: 8083
          - path: /cart
            pathType: Prefix
            backend:
              service:
                name: cart-service
                port:
                  number: 8084
          - path: /order
            pathType: Prefix
            backend:
              service:
                name: order-service
                port:
                  number: 8085
          - path: /categories
            pathType: Prefix
            backend:
              service:
                name: category-service
                port:
                  number: 8086
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  number: 8087
          - path: /eureka
            pathType: Prefix
            backend:
              service:
                name: service-registry
                port:
                  number: 8761
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
