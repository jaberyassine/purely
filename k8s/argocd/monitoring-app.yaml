apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # Bootstrap CRDs and their custom resources without requiring cached schemas for diff.
    argocd.argoproj.io/compare-options: ServerSideDiff=false
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: '92.22.0'
    helm:
      releaseName: monitoring
      values: |
        # Azure manages these control-plane endpoints; do not scrape unreachable targets.
        kubeEtcd:
          enabled: false
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        grafana:
          additionalDataSources:
            - name: Purely Prometheus
              uid: purely-prometheus
              type: prometheus
              access: proxy
              url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
              isDefault: false
              jsonData:
                httpMethod: POST
                timeInterval: 15s
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          service:
            type: ClusterIP
          persistence:
            enabled: true
            storageClassName: managed-csi
            size: 4Gi
          deploymentStrategy:
            type: Recreate
          initChownData:
            enabled: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 472
            runAsGroup: 472
            fsGroup: 472
            seccompProfile: { type: RuntimeDefault }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          sidecar:
            dashboards:
              searchNamespace: ALL
        prometheus:
          prometheusSpec:
            serviceMonitorSelector:
              matchLabels:
                release: monitoring
            serviceMonitorNamespaceSelector: {}
            retention: 2d
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes: [ReadWriteOnce]
                  storageClassName: managed-csi
                  resources:
                    requests:
                      storage: 16Gi
            resources:
              requests: { cpu: 200m, memory: 512Mi }
              limits: { cpu: '1', memory: 1536Mi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
