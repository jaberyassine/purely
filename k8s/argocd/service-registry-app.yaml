apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-registry
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  project: purely
  source:
    repoURL: https://github.com/jaberyassine/purely.git
    targetRevision: HEAD
    path: k8s/charts/service-registry
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: service-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true